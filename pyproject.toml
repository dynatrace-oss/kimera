[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kimera"]
exclude = ["**/.DS_Store", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[project]
name = "kimera"
version = "0.4.0"
description = "Kubernetes Security Testing Toolkit"
authors = [{name = "Dynatrace OSS", email = "opensource@dynatrace.com"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "kubernetes",
    "security",
    "kspm",
    "penetration-testing",
    "network-policy",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.3.3",
    "kubernetes>=36.0.3",
    "pydantic>=2.0.0,<3",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "tabulate>=0.9.0",
    "jsonpatch>=1.33",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.4.0",
    "jinja2>=3.1.0",
]
mcp-server = [
    # server.py uses FastMCP, removed in mcp 2.x. Lift the cap with the migration.
    "mcp[cli]>=1.0.0,<2",
]
litellm = [
    "litellm>=1.100.0",
]
all = [
    "kimera[llm,mcp-server,litellm]",
]

[project.urls]
Homepage = "https://github.com/dynatrace-oss/kimera"
Repository = "https://github.com/dynatrace-oss/kimera"
Issues = "https://github.com/dynatrace-oss/kimera/issues"
Changelog = "https://github.com/dynatrace-oss/kimera/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dynatrace-oss/kimera#readme"

[project.scripts]
kimera = "kimera.exploit_k8s:main"
kimera-mcp = "kimera.mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pip-audit>=2.10.1",
    "pip>=26.2",
    "types-pyyaml>=6.0.12.20260906",
    # The suite covers the optional integrations, so a dev install carries them.
    "kimera[all]",
]

[tool.ruff.format]
docstring-code-format = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --ignore=tests/test_mcp_server.py"

[tool.coverage.run]
source_pkgs = ["kimera"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Untracked local experiment scaffolding, absent from a fresh checkout.
exclude = "^(harness|run|queries)/"

[[tool.mypy.overrides]]
module = [
    "kubernetes.*",
    "jsonpatch",
    "anthropic",
    "anthropic.*",
    "jinja2",
    "jinja2.*",
    "litellm",
    "litellm.*",
    "mcp",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
warn_unreachable = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "D"]
ignore = ["E501", "D100"]  # E501: handled by ruff format; D100: module docstrings not required

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**" = ["S101", "D"]
"src/kimera/container/core/k8s_client.py" = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"
