name: Publish

# Two independent brakes: the environment requires a reviewer, and the token
# lives on that environment rather than on the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Verify tag matches pyproject.toml version
      if: github.event_name == 'push'
      run: |
        tag_version="${GITHUB_REF_NAME#v}"
        pkg_version=$(grep -m1 -E '^version = "' pyproject.toml | sed -E 's/^version = "(.*)"$/\1/')
        if [[ "$tag_version" != "$pkg_version" ]]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version"
          exit 1
        fi
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Build sdist and wheel
      run: uv build
    - name: Check metadata
      run: uvx twine check dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Publish
      run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Publish
      run: uv publish dist/*
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  smoke-test:
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install from PyPI and exercise the console scripts
      run: |
        python -m venv /tmp/smoke
        # PyPI's CDN can take minutes to propagate a fresh upload to every edge node.
        for i in $(seq 1 15); do
          /tmp/smoke/bin/pip install "kimera[all]==${GITHUB_REF_NAME#v}" && break
          sleep 20
        done
        /tmp/smoke/bin/kimera --version
        /tmp/smoke/bin/kimera --help
        /tmp/smoke/bin/kimera-mcp --help
    - name: Assert the packaged data files shipped
      run: |
        /tmp/smoke/bin/python - <<'PY'
        from kimera.resources import config_dir, prompts_dir
        assert (config_dir() / "default.yaml").is_file()
        assert list((config_dir() / "techniques").glob("*.yaml"))
        assert list(prompts_dir().glob("*.j2"))
        print("data files present")
        PY

  github-release:
    needs: [smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: Extract the version's changelog section
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v ver="$version" '
          $0 ~ "^## \\[" ver "\\]" { found=1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
    - name: Create GitHub release
      run: gh release create "$GITHUB_REF_NAME" --title "Kimera $GITHUB_REF_NAME" --notes-file release-notes.md
      env:
        GH_TOKEN: ${{ github.token }}
